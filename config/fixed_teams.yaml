schema_version: 1

# Fixed teams are generated deterministically from Pokémon Showdown's
# random-battle generator, frozen on disk and then reused in Custom Game.
#
# Information policy:
# - Gen I and Gen IV Custom Game do not use Team Preview by default.
# - Gen IX Team Preview is explicitly removed to keep the same partial-
#   observability condition across all three benchmark generations.

generations:
  1:
    source_format: "gen1randombattle"
    validation_format: "gen1customgame"
    battle_format: "gen1customgame"
    pairs:
      - id: "pair01"
        team_a_seed: "101,202,303,404"
        team_b_seed: "505,606,707,808"
      - id: "pair02"
        team_a_seed: "1101,1202,1303,1404"
        team_b_seed: "1505,1606,1707,1808"
      - id: "pair03"
        team_a_seed: "2101,2202,2303,2404"
        team_b_seed: "2505,2606,2707,2808"

  4:
