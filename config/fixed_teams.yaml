# PokéBench30 v0.6 fixed/mirrored evaluation pool.
#
# Ten independent deterministic team pairs are generated per generation from
# Pokémon Showdown's random-battle generator and frozen on disk.
#
# The first three pairs are retained from v0.3-v0.5 for continuity. Seven new
# pairs are added so the primary cross-generation analysis has 10 independent
# pair units per generation instead of only 3.
#
# Gen I and Gen IV Custom Game do not use Team Preview by default.
# Gen IX Team Preview is explicitly removed to keep the same partial-
# observability condition across all three benchmark generations.
#
# The universal v0.6 core action space intentionally excludes generation-
# specific gimmicks (e.g. Terastallization) so all generations expose the same
# 10 actions. This is a common-core cross-generation benchmark.
schema_version: 1
generations:
  1:
    source_format: gen1randombattle
    validation_format: gen1customgame
    battle_format: gen1customgame
    pairs:
    - id: pair01
