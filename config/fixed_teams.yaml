schema_version: 1

# Each prepared team is generated deterministically by the local Pokémon
# Showdown random-team generator using the seed below. The resulting packed
# team is then frozen on disk and reused in a non-random Custom Game.
#
# Team Preview is explicitly removed from controlled battles so the partial
# information policy from v0.2.2 is preserved.

generations:
  1:
    source_format: "gen1randombattle"
    validation_format: "gen1customgame"
    battle_format: "gen1customgame"
    pairs:
      - id: "pair01"
        team_a_seed: "101,202,303,404"
        team_b_seed: "505,606,707,808"
      - id: "pair02"
        team_a_seed: "1101,1202,1303,1404"
        team_b_seed: "1505,1606,1707,1808"
      - id: "pair03"
        team_a_seed: "2101,2202,2303,2404"
        team_b_seed: "2505,2606,2707,2808"

  4:
    source_format: "gen4randombattle"
