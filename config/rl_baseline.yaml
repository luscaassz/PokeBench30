schema_version: 1

algorithm:
  name: "MaskablePPO"
  policy: "MlpPolicy"
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_net_arch: [256, 128]

reward:
  fainted_value: 2.0
  hp_value: 1.0
  status_value: 0.5
  victory_value: 30.0

training:
  default_generation: 9
  default_opponent: "type_aware"
  default_timesteps: 10000
  default_seed: 42
  default_representation: "ubr-1.2"
  default_device: "auto"
  training_format_template: "gen{generation}randombattle"

evaluation:
  deterministic: true
  require_same_generation: true

research_policy:
  universal_representation: "ubr-1.2"
  observation_dim: 518
  action_dim: 10
  generation_specific_gimmicks: false
  cross_generation_evaluation: "reserved for v0.6"

multiseed:
  representations: ["ubr-1.1", "ubr-1.2"]
  seeds: [42, 123, 456, 789, 2026]
  timesteps: 10000
  training_opponent: "type_aware"
  evaluation_opponents: ["random", "type_aware"]
  repeats_per_leg: 10


budget_study:
  representations: ["ubr-1.1", "ubr-1.2"]
  seeds: [42, 123, 456, 789, 2026]
  budgets: [10000, 50000]
  baseline_budget: 10000
  training_opponent: "type_aware"
  evaluation_opponents: ["random", "type_aware"]
  repeats_per_leg: 10
